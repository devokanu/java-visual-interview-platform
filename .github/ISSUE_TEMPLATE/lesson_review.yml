name: Lesson Review
description: Tek ders içeriğini bilişsel erişilebilirlik ve derinlik açısından inceleme
title: "[Lesson Review] M__-L__ - "
labels: ["lesson", "review", "ai-workflow"]
body:
  - type: input
    id: ai_owner
    attributes:
      label: AI Owner
      placeholder: Claude
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: "Mevcut ders adayını sıkı kalite kontrolünden geçir."
    validations:
      required: true
  - type: textarea
    id: context_files
    attributes:
      label: Context Files
      value: |
        - PROJECT_CONTEXT.md
        - AI_HANDOFF.md
        - DECISIONS.md
        - LESSON_TEMPLATE.md
        - VISUAL_ANIMATION_SYSTEM.md
        - INTERVIEW_SYSTEM.md
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      placeholder: "İncelenecek ders dosyası veya metni."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: |
        - İçeriği yeniden yazma; önce bulgu çıkar.
        - Tam müfredat üretme.
        - D30 progressive depth ilkesini merkeze al.
        - Çok sığlaşma ve fazla karmaşıklaşma riskini birlikte değerlendir.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      placeholder: "Bilişsel yük, görsel özgünlük, üretim gerçekçiliği ve interview kalitesini değerlendir."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - Güçlü yanlar listelendi.
        - Zayıf/riskli noktalar listelendi.
        - Minimal patch önerileri çıkarıldı.
        - Dosya bazlı etki listesi verildi.
    validations:
      required: true
  - type: textarea
    id: output_required
    attributes:
      label: Output Required
      placeholder: "Review raporu."
    validations:
      required: true
  - type: dropdown
    id: memory_update
    attributes:
      label: Memory Update Required?
      options:
        - "Hayır"
        - "Evet: yalnızca karar kabul edilirse"
    validations:
      required: true
