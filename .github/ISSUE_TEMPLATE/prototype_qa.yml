name: Prototype QA
description: Prototip akışı, erişilebilirlik, mobil ve soft-check doğrulaması
title: "[Prototype QA] "
labels: ["prototype", "qa", "accessibility"]
body:
  - type: input
    id: ai_owner
    attributes:
      label: AI Owner
      placeholder: Codex GPT-5.5
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: "Mevcut prototipi build ve tarayıcıda doğrula."
    validations:
      required: true
  - type: textarea
    id: context_files
    attributes:
      label: Context Files
      value: |
        - PROJECT_CONTEXT.md
        - AI_HANDOFF.md
        - DECISIONS.md
        - src/App.jsx
        - src/data/*.js
        - src/styles.css
        - checklists/prototype_checklist.md
        - checklists/accessibility_checklist.md
        - checklists/mobile_test_checklist.md
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      placeholder: "Test edilecek URL, dersler, cihaz/viewport listesi."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: |
        - App davranışını değiştirme; yalnızca QA veya rapor.
        - Patch gerekirse önce minimal patch listesi çıkar.
        - Hard-lock olmadığını doğrula.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      placeholder: "Build, lesson flow, tab visibility, code sync, soft-check, mobile risk kontrolü."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - npm run build sonucu raporlandı.
        - En az desktop + dar viewport kontrol edildi.
        - Code visibility rule doğrulandı.
        - Soft-check ikinci yanlışta devam izni doğrulandı.
        - Riskler net listelendi.
    validations:
      required: true
  - type: textarea
    id: output_required
    attributes:
      label: Output Required
      placeholder: "QA raporu, kalan riskler, önerilen minimal patch."
    validations:
      required: true
  - type: dropdown
    id: memory_update
    attributes:
      label: Memory Update Required?
      options:
        - "Hayır"
        - "Evet: baseline kabul edilirse"
    validations:
      required: true
