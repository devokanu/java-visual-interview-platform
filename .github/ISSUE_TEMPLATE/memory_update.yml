name: Memory Update
description: Kabul edilen karar veya ilerlemeyi proje hafızasına işleme
title: "[Memory Update] "
labels: ["memory", "documentation", "ai-workflow"]
body:
  - type: input
    id: ai_owner
    attributes:
      label: AI Owner
      placeholder: Claude veya Codex
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: "Kabul edilen kararı ve kısa progress notunu hafızaya işle."
    validations:
      required: true
  - type: textarea
    id: context_files
    attributes:
      label: Context Files
      value: |
        - PROJECT_CONTEXT.md
        - AI_HANDOFF.md
        - DECISIONS.md
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      placeholder: "Kaydedilecek karar/progress notu."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: |
        - Tüm dosyayı yeniden yazma.
        - Sadece ilgili bölümleri yama.
        - DECISIONS.md yalnızca gerçek karar varsa güncellenir.
        - App code değiştirme.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      placeholder: "Current Progress, AI_HANDOFF ve gerekirse Decision Log güncelle."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - PROJECT_CONTEXT.md güncellendi.
        - AI_HANDOFF.md güncellendi.
        - DECISIONS.md gerekliyse güncellendi.
        - src/ dosyalarına dokunulmadı.
    validations:
      required: true
  - type: textarea
    id: output_required
    attributes:
      label: Output Required
      placeholder: "Değişen hafıza dosyaları ve ne kaydedildi."
    validations:
      required: true
  - type: dropdown
    id: memory_update
    attributes:
      label: Memory Update Required?
      options:
        - "Evet"
    validations:
      required: true
