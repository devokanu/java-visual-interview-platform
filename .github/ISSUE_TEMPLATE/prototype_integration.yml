name: Prototype Integration
description: Onaylı tek ders içeriğini prototipe entegre etme
title: "[Prototype Integration] M__-L__ - "
labels: ["prototype", "integration", "codex"]
body:
  - type: input
    id: ai_owner
    attributes:
      label: AI Owner
      placeholder: Codex GPT-5.5
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: "Onaylı ders adayını mevcut prototipe ekle."
    validations:
      required: true
  - type: textarea
    id: context_files
    attributes:
      label: Context Files
      value: |
        - PROJECT_CONTEXT.md
        - AI_HANDOFF.md
        - DECISIONS.md
        - LESSON_TEMPLATE.md
        - VISUAL_ANIMATION_SYSTEM.md
        - Existing src/data lesson files
        - src/App.jsx
        - src/styles.css
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      placeholder: "Onaylı final content candidate dosyası."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: |
        - Yeni ders yalnızca istenirse eklenir; tam müfredat üretme.
        - App.jsx içine tüm içerik hardcode etme.
        - Code yalnızca Code tab içinde görünür.
        - Soft-check kullan; hard-lock yok.
        - Vite + React final stack kararı değildir.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      placeholder: "Ayrı lesson data objesi oluştur, navigation bağla, visual/code/assessment sync kur."
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      value: |
        - npm run build geçer.
        - Önceki ders akışı bozulmaz.
        - Yeni ders sekmeleri çalışır.
        - Visual step ve code highlight senkron çalışır.
        - Wrong answer soft-check tetikler.
        - Documentation sadece kısa progress notu alır.
    validations:
      required: true
  - type: textarea
    id: output_required
    attributes:
      label: Output Required
      placeholder: "Değişen dosyalar, build sonucu, manuel doğrulama."
    validations:
      required: true
  - type: dropdown
    id: memory_update
    attributes:
      label: Memory Update Required?
      options:
        - "Evet: AI_HANDOFF.md + PROJECT_CONTEXT.md kısa progress"
        - "Evet: karar kabul edilirse DECISIONS.md de"
        - "Hayır"
    validations:
      required: true
